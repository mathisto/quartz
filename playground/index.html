<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quartz Playground</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #313244;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --accent: #89b4fa;
      --green: #a6e3a1;
      --red: #f38ba8;
      --border: #45475a;
      --editor-bg: #1e1e2e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    header h1 span { color: var(--accent); }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    #run-btn {
      background: var(--accent);
      color: var(--bg);
    }
    #run-btn:hover { filter: brightness(1.1); }
    #run-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #example-select {
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
    }
    .status {
      font-size: 13px;
      color: var(--subtext);
    }
    .status.ok { color: var(--green); }
    .status.err { color: var(--red); }
    main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .output-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .pane-header {
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    #editor {
      flex: 1;
      min-height: 0;
    }
    #output {
      flex: 1;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-y: auto;
      white-space: pre-wrap;
      background: var(--bg);
    }
    .output-line { color: var(--text); }
    .output-exit { color: var(--subtext); margin-top: 8px; }
    .output-exit.success { color: var(--green); }
    .output-exit.failure { color: var(--red); }
    .output-error { color: var(--red); }
    .output-time { color: var(--subtext); font-size: 12px; }

    @media (max-width: 768px) {
      main { flex-direction: column; }
      .editor-pane { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <h1><span>Quartz</span> Playground</h1>
    <div class="toolbar">
      <select id="example-select">
        <option value="hello" selected>Hello World</option>
        <option value="pipeline">Pipelines</option>
        <option value="closures">Closures</option>
        <option value="strings">String Processing</option>
        <option value="structs">Structs</option>
        <option value="collections">Collections</option>
        <option value="fib">Fibonacci</option>
        <option value="compose">Composition</option>
        <option value="bits">Bit Ops</option>
      </select>
      <button id="run-btn">Run</button>
      <span id="status" class="status"></span>
    </div>
  </header>
  <main>
    <div class="editor-pane">
      <div class="pane-header">Source</div>
      <div id="editor"></div>
    </div>
    <div class="output-pane">
      <div class="pane-header">Output</div>
      <div id="output"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script type="module">
    import { createRuntime, WasmExit } from './runtime.js';

    // ---- Examples ----
    const EXAMPLES = {
      hello: `## Welcome to Quartz — a modern systems language
def main(): Int
  var name = "Quartz"
  puts("Hello, #{name}!")
  puts("Version #{5}.#{25} — self-hosted since Jan 2026")
  puts("Compiled to #{1 + 1 + 1} backends: LLVM, C, WASM")
  return 0
end`,
      pipeline: `## Pipelines + endless def + UFCS
def double(x: Int): Int = x * 2
def square(x: Int): Int = x * x
def negate(x: Int): Int = 0 - x

def main(): Int
  ## The pipe operator threads values through functions
  var result = 3 |> double |> square |> negate
  puts("3 |> double |> square |> negate = #{result}")

  ## UFCS lets you chain string methods naturally
  var text = "  hello world  "
  puts(text.trim().upcase().replace(" ", ", "))

  ## Combine pipes and UFCS
  var greeting = "  welcome to quartz  "
  puts(greeting.trim().upcase())
  return 0
end`,
      closures: `## Closures capture their environment
def make_multiplier(factor: Int): Fn(Int): Int
  return x -> x * factor
end

def compose(f: Fn(Int): Int, g: Fn(Int): Int): Fn(Int): Int
  return x -> f(g(x))
end

def inc(x: Int): Int = x + 1
def double(x: Int): Int = x * 2

def main(): Int
  var triple = make_multiplier(3)
  puts("triple(7) = #{triple(7)}")
  puts("triple(14) = #{triple(14)}")

  var double_then_inc = compose(inc, double)
  var inc_then_double = compose(double, inc)
  puts("double then inc: #{double_then_inc(10)}")
  puts("inc then double: #{inc_then_double(10)}")
  return 0
end`,
      strings: `## String processing — UFCS chains + interpolation
def main(): Int
  var csv = "Alice,Bob,Charlie,Diana"
  var names = csv.split(",")
  puts("#{names.size()} people: #{names.get(0)}, #{names.get(1)}...")

  ## UFCS chains read left-to-right
  puts("  whisper  ".trim().upcase())

  ## Replace, repeat, case
  var stars = "*".repeat(30)
  puts(stars)
  puts(csv.replace(",", " | "))
  puts(stars)

  puts("hello".upcase())
  puts("WORLD".downcase())
  return 0
end`,
      structs: `## Structs + interpolation + endless def
struct Point
  x: Int
  y: Int
end

def manhattan(p: Point): Int = p.x + p.y

def scale(p: Point, factor: Int): Point
  return Point { x: p.x * factor, y: p.y * factor }
end

def main(): Int
  var p = Point { x: 3, y: 4 }
  var big = scale(p, 10)

  puts("p = (#{p.x}, #{p.y}), manhattan = #{manhattan(p)}")
  puts("scaled = (#{big.x}, #{big.y}), manhattan = #{manhattan(big)}")
  return 0
end`,
      collections: `## Vec literals + HashMap UFCS + for-in
def main(): Int
  ## Array literals create vectors
  var scores = [95, 87, 92, 78, 100]
  var names = ["Alice", "Bob", "Charlie"]

  var total = 0
  for i in 0..scores.size()
    total += scores.get(i)
  end
  puts("#{scores.size()} scores, avg = #{total / scores.size()}")

  for i in 0..names.size()
    puts("  #{names.get(i)}: #{scores.get(i)}")
  end

  ## HashMap with UFCS + large values
  var config = hashmap_new()
  config.set("host", 8080)
  config.set("timeout", 30000)
  config.set("retries", 3)
  var host = config.get("host")
  var timeout = config.get("timeout")
  puts("host=#{host}, timeout=#{timeout}")
  return 0
end`,
      fib: `## Fibonacci — recursion + for-in + interpolation
def fib(n: Int): Int
  if n <= 1
    return n
  end
  return fib(n - 1) + fib(n - 2)
end

def main(): Int
  for i in 0..12
    puts("fib(#{i}) = #{fib(i)}")
  end
  return 0
end`,
      compose: `## Higher-order functions + pattern matching
def apply(f: Fn(Int): Int, val: Int): Int = f(val)

def classify(n: Int): Int
  match n
    0 => return 0
    1 => return 1
    _ => return 2
  end
end

def main(): Int
  var labels = vec_new()
  labels.push("zero")
  labels.push("one")
  labels.push("many")

  for i in 0..5
    var c = apply(classify, i)
    puts("#{i} -> #{labels.get(c)}")
  end
  return 0
end`,
      bits: `## Bit manipulation — native WASM i64 instructions
def main(): Int
  puts("popcount(255) = #{popcount(255)}")
  puts("clz(1) = #{clz(1)}")
  puts("ctz(8) = #{ctz(8)}")
  puts("bnot(0) = #{bnot(0)}")

  puts("15 AND 9 = #{band(15, 9)}")
  puts("5 OR 3 = #{bor(5, 3)}")
  puts("15 XOR 9 = #{bxor(15, 9)}")
  puts("1 << 10 = #{shl(1, 10)}")
  return 0
end`,
    };

    // ---- Compiler ----
    let compilerWasm = null;
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');
    const runBtn = document.getElementById('run-btn');
    const exampleSelect = document.getElementById('example-select');
    let editor = null;

    function setStatus(text, cls = '') {
      statusEl.textContent = text;
      statusEl.className = 'status ' + cls;
    }

    function clearOutput() {
      outputEl.innerHTML = '';
    }

    function appendOutput(text, cls = 'output-line') {
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      outputEl.appendChild(span);
    }

    // ---- Compile & Run (server-side compilation for now) ----
    // The playground compiles via a local compiler and runs the WASM in-browser.
    // For full in-browser compilation, we'd need the Quartz compiler compiled to WASM.

    async function compileAndRun(source) {
      clearOutput();
      setStatus('Compiling...', '');
      runBtn.disabled = true;
      const startTime = performance.now();

      try {
        // Try server-side compilation first (if API available)
        let wasmBytes;
        try {
          const resp = await fetch('/api/compile', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ source }),
          });
          if (resp.ok) {
            wasmBytes = await resp.arrayBuffer();
          } else {
            const raw = await resp.text();
            const err = raw.replace(/\x1b\[[0-9;]*m/g, '');
            setStatus('Compile error', 'err');
            appendOutput(err, 'output-error');
            return;
          }
        } catch {
          // No server — try using pre-compiled compiler WASM (Phase 10 stretch)
          setStatus('No compile server available', 'err');
          appendOutput('The playground requires a compile server.\n', 'output-error');
          appendOutput('Start one with: quake playground\n', 'output-error');
          appendOutput('\nOr compile locally:\n', 'output-line');
          appendOutput('  quartz --backend wasm -o program.wasm program.qz\n', 'output-line');
          return;
        }

        // Run the compiled WASM
        setStatus('Running...', '');
        const outputBuf = [];
        const runtime = createRuntime({ output: outputBuf });

        const wasmModule = await WebAssembly.compile(wasmBytes);
        const instance = await WebAssembly.instantiate(wasmModule, runtime.imports);
        runtime.setMemory(instance.exports.memory);

        let exitCode = 0;
        try {
          instance.exports._start();
        } catch (e) {
          if (e instanceof WasmExit) {
            exitCode = e.code;
          } else {
            throw e;
          }
        }

        const elapsed = (performance.now() - startTime).toFixed(1);

        // Display output
        if (outputBuf.length > 0) {
          appendOutput(outputBuf.join(''), 'output-line');
        }

        const exitCls = exitCode === 0 ? 'success' : 'failure';
        appendOutput(`\nProcess exited with code ${exitCode}`, `output-exit ${exitCls}`);
        appendOutput(`\n${elapsed}ms`, 'output-time');
        setStatus(exitCode === 0 ? 'Success' : `Exit ${exitCode}`, exitCode === 0 ? 'ok' : 'err');
      } catch (e) {
        setStatus('Runtime error', 'err');
        appendOutput(`Error: ${e.message}\n`, 'output-error');
        if (e.stack) appendOutput(e.stack + '\n', 'output-error');
      } finally {
        runBtn.disabled = false;
      }
    }

    // ---- Monaco Editor ----
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      // Register Quartz language
      monaco.languages.register({ id: 'quartz' });
      monaco.languages.setMonarchTokensProvider('quartz', {
        keywords: ['def', 'end', 'if', 'else', 'while', 'for', 'in', 'return', 'var', 'match',
                   'struct', 'enum', 'trait', 'impl', 'import', 'from', 'true', 'false',
                   'and', 'or', 'not', 'do', 'priv', 'const', 'extern'],
        typeKeywords: ['Int', 'String', 'Bool', 'Void', 'Float', 'Fn'],
        operators: ['=>', '->', '=', '==', '!=', '<', '<=', '>', '>=', '+', '-', '*', '/', '%', '..'],
        tokenizer: {
          root: [
            [/##.*$/, 'comment'],
            [/#\{/, { token: 'string.interpolation', next: '@interpolation' }],
            [/"/, { token: 'string.quote', next: '@string' }],
            [/[a-z_]\w*/, { cases: { '@keywords': 'keyword', '@typeKeywords': 'type', '@default': 'identifier' } }],
            [/[A-Z]\w*/, 'type'],
            [/\d+/, 'number'],
            [/[{}()\[\]]/, '@brackets'],
            [/[=><!~?:&|+\-*\/^%]+/, { cases: { '@operators': 'operator', '@default': '' } }],
          ],
          string: [
            [/#\{/, { token: 'string.interpolation', next: '@interpolation' }],
            [/[^"#]+/, 'string'],
            [/"/, { token: 'string.quote', next: '@pop' }],
          ],
          interpolation: [
            [/\}/, { token: 'string.interpolation', next: '@pop' }],
            [/./, 'identifier'],
          ],
        },
      });

      // Dark theme
      monaco.editor.defineTheme('quartz-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [
          { token: 'keyword', foreground: 'cba6f7' },
          { token: 'type', foreground: '89b4fa' },
          { token: 'string', foreground: 'a6e3a1' },
          { token: 'number', foreground: 'fab387' },
          { token: 'comment', foreground: '6c7086' },
          { token: 'operator', foreground: '89dceb' },
          { token: 'string.interpolation', foreground: 'f5c2e7' },
        ],
        colors: {
          'editor.background': '#1e1e2e',
          'editor.foreground': '#cdd6f4',
          'editor.lineHighlightBackground': '#313244',
          'editor.selectionBackground': '#45475a',
          'editorCursor.foreground': '#f5e0dc',
        },
      });

      editor = monaco.editor.create(document.getElementById('editor'), {
        value: EXAMPLES.hello,
        language: 'quartz',
        theme: 'quartz-dark',
        fontSize: 14,
        fontFamily: "'SF Mono', 'Fira Code', 'Cascadia Code', monospace",
        minimap: { enabled: false },
        padding: { top: 16 },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        tabSize: 2,
      });

      // Keybindings
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
        compileAndRun(editor.getValue());
      });
    });

    // ---- Event handlers ----
    runBtn.addEventListener('click', () => {
      if (editor) compileAndRun(editor.getValue());
    });

    exampleSelect.addEventListener('change', () => {
      const val = exampleSelect.value;
      if (val && EXAMPLES[val] && editor) {
        editor.setValue(EXAMPLES[val]);
      }
    });

    setStatus('Ready');
  </script>
</body>
</html>
